name: Release
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
        - stable
        - preview
        default: stable
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true
      app:
        description: Optional app ID; empty selects every advanced app
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/plan.yml@181636b602317ba703c3f4bf12775c34560f4efb
    with:
      toolkit-ref: 181636b602317ba703c3f4bf12775c34560f4efb
      channel: ${{ inputs.channel }}
      app: ${{ inputs.app }}
  build:
    name: Build, Test & Upload (${{ matrix.target_name }})
    needs:
    - plan
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['mm-manager'].selected
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          arch: x64
          target_name: Linux-x64
          package_glob: '*.tar.gz'
          cmake_arg: ''
          shell_type: bash
        - os: macos-latest
          arch: x64
          target_name: macOS-x64
          package_glob: '*.tar.gz'
          cmake_arg: ''
          shell_type: bash
        - os: windows-latest
          arch: x64
          target_name: Windows-x64
          package_glob: '*.zip'
          cmake_arg: ''
          shell_type: pwsh
        - os: windows-latest
          arch: x86
          target_name: Windows-x86
          package_glob: '*.zip'
          cmake_arg: -A Win32
          shell_type: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell_type }}
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install socat (macOS)
      if: runner.os == 'macOS'
      run: brew install socat
    - name: Install NSIS (Windows)
      if: runner.os == 'Windows'
      run: |
        if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") -and -not (Test-Path "$env:ProgramFiles\NSIS\makensis.exe")) {
          choco install nsis -y --no-progress
        }
    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_arg }}
    - name: Build Project
      run: cmake --build build --config Release
    - name: Run Tests
      working-directory: ./build
      run: ctest -C Release --output-on-failure
    - name: Package with CPack
      working-directory: ./build
      run: cpack -C Release
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-${{ matrix.os }}-${{ strategy.job-index }}
        path: |-
          build/mmumblephone-*.zip
          build/mmumblephone-*.exe
          build/mmumblephone-*.tar.gz
        if-no-files-found: error
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['mm-manager'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['mm-manager'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read
  assemble:
    runs-on: ubuntu-latest
    needs:
    - plan
    - build
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['mm-manager'].selected
    env:
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: native-*
        path: artifacts
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: JX-Holdings-LLC/release-infrastructure
        ref: 181636b602317ba703c3f4bf12775c34560f4efb
        path: .toolkit
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
    - name: Stage the complete configured release inventory
      shell: bash
      env:
        RELEASE_APP: mm-manager
      run: node .toolkit/src/release.mjs stage --app "$RELEASE_APP" --from artifacts --bundle unified-bundle --sha
        "$RELEASE_SOURCE_SHA"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bundle-mm-manager
        path: unified-bundle
        if-no-files-found: error
  publish-mm-manager:
    needs:
    - plan
    - assemble
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['mm-manager'].selected
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/finish.yml@181636b602317ba703c3f4bf12775c34560f4efb
    permissions:
      contents: write
    with:
      toolkit-ref: 181636b602317ba703c3f4bf12775c34560f4efb
      source-sha: ${{ needs.plan.outputs.sha }}
      app: mm-manager
      security: standard
      artifact: bundle-mm-manager
      dry-run: ${{ inputs.dry_run }}
